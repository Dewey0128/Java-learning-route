<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div id="app">

    <!--
    | v-bind    | 为HTML标签绑定属性值，如设置  href , css样式等      |-->
    <a v-bind:href="url">点击</a>
    <!--
    | v-model   | 在表单元素上创建双向数据绑定                        |-->
    <input v-model = "url">

</div>


<script src = "js/vue.js"></script>
<script>
    new Vue({
        el : "#app",
        data(){
            return {
                url : "http://www.baidu.com"
            }
        }
    })
</script>
</body>
</html>
