<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<script>
    //1.创建核心对象
    var xhhtp;
    if(window.XMLHttpRequest){
        xttp = new XMLHttpRequest();
    }else{
        // code for IE5, IE6
        xhhtp = new ActiveXObject("Microsoft.XMLHTTP");
    }

    //发送请求
    xhttp.open("GET", "http://localhost:8080/ajax/ajaxDemo01")
    xhhtp.send();

    //获取响应
    xttp.onreadystatechange = function (){
        if(this.readyState == 4 && this.status == 200){
            alert(this.responseText);
        }
    };


</script>

</body>
</html>
