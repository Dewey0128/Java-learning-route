<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<div id="app">


    {{count}}
    <div v-if="count === 1">div1</div>
    <div v-else-if="count === 2">div2</div>
    <div v-else>div3</div>
    <br>
    <!-- 添加类型限制为数字 -->
    <input v-model.number="count" type="number">


</div>


<script src = "js/vue.js"></script>
<script>
    new Vue({
        el : "#app",
        data(){
            return {
                count : 0,
                url : "http://www.baidu.com"
            }
        },
        methods:{
            show(){
                alert("我被点了！")
            }
        }
    });
</script>
</body>
</html>
