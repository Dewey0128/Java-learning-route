<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>第一个Vue程序</title>
    <!-- 安装Vue: 当你使用script进行Vue安装之后，上下文就注册了一个全局变量：Vue-->
    <script src="../js/vue.js"></script>
</head>
<body>
    <!--指定Vue实例的挂载位置-->
    <!--<div id="app"></div>-->
    <div id="app"></div>

<script>
    const myVue = new Vue ({
        template:"<h1>Hello Vue!</h1>"
    });

    /*
    第二步：将Vue实例挂载到id='app'的元素位置。
    1. Vue实例都有一个$mount()方法，这个方法的作用是什么？
        将Vue实例挂载到指定位置。
    2. #app 显然是ID选择器。这个语法借鉴了CSS。
    myVue.$mount(document.getElementById('app'))*/

    myVue.$mount('#app');
</script>

</body>
</html>
